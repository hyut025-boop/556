  <title>午後ローTimer</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f0e8;
      --surface: #fffef9;
      --border: rgba(0,0,0,0.08);
      --text: #1a1814;
      --muted: rgba(26,24,20,0.45);
      --accent: #c0392b;
      --accent-light: #fdf0ee;
      --gold: #8b6914;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --surface: #1e1c19;
        --border: rgba(255,255,255,0.08);
        --text: #f0ece3;
        --muted: rgba(240,236,227,0.45);
        --accent: #e05c4e;
        --accent-light: #2a1512;
        --gold: #c4a44a;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1.25rem 2rem;
      gap: 1.25rem;
    }

    .top-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-align: center;
    }
    .logo-wrap {
      text-align: center;
      padding: 0.25rem 0;
    }
    .logo-wrap img {
      width: min(72%, 260px);
      height: auto;
      display: inline-block;
    }
    @media (prefers-color-scheme: dark) {
      .logo-wrap img { filter: brightness(0.9) saturate(1.1); }
    }

    .clock-section {
      text-align: center;
      padding: 0.5rem 0;
    }
    .clock {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(56px, 20vw, 84px);
      font-weight: 400;
      color: var(--text);
      letter-spacing: -1px;
      line-height: 1;
      transition: color 0.4s;
    }
    .clock.ringing { color: var(--accent); }
    .date-str {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.06em;
    }

    .movie-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      position: relative;
    }
    .movie-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      transition: opacity 0.3s;
    }
    .live-dot.inactive { background: var(--muted); }
    .card-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .time-badge {
      margin-left: auto;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-light);
      padding: 3px 10px;
      border-radius: 99px;
    }

    .movie-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .movie-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
    .movie-theme {
      font-size: 11px;
      color: var(--gold);
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    .divider {
      height: 0.5px;
      background: var(--border);
      margin: 0.25rem 0;
    }

    .next-section {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .next-header {
      padding: 0.75rem 1.25rem 0.5rem;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .next-item {
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-top: 0.5px solid var(--border);
    }
    .next-date {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 72px;
    }
    .next-title {
      font-size: 14px;
      color: var(--text);
      line-height: 1.4;
    }

    .countdown-bar {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      text-align: center;
    }
    .countdown-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .countdown-num {
      font-family: 'Noto Serif JP', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--text);
    }

    .btn-area { display: flex; gap: 8px; }
    .btn-stop {
      flex: 1; padding: 15px;
      border-radius: 12px; border: none;
      background: var(--accent); color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px; font-weight: 500;
      cursor: pointer; display: none;
      letter-spacing: 0.05em;
    }
    .btn-test {
      flex: 1; padding: 14px;
      border-radius: 12px;
      border: 0.5px solid var(--border);
      background: transparent; color: var(--muted);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .btn-test:active { background: var(--surface); color: var(--text); }

    .ringing-banner {
      display: none;
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 1rem;
      border-radius: 14px;
      font-family: 'Noto Serif JP', serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.05em;
      animation: pulse-bg 0.8s infinite alternate;
    }
    @keyframes pulse-bg {
      from { opacity: 1; }
      to { opacity: 0.85; }
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="logo.png" alt="午後のロードショー">
  </div>

  <div class="clock-section">
    <div class="clock" id="clock">--:--</div>
    <div class="date-str" id="date-str"></div>
  </div>

  <div class="ringing-banner" id="ringing-banner">
    ただいま放送中！
  </div>

  <div class="movie-card" id="today-card">
    <div class="movie-card-header">
      <div class="live-dot" id="live-dot"></div>
      <div class="card-label" id="card-label">本日の放送</div>
      <div class="time-badge">13:40〜</div>
    </div>
    <div class="movie-title" id="movie-title">—</div>
    <div class="movie-meta" id="movie-meta"></div>
    <div class="movie-theme" id="movie-theme"></div>
  </div>

  <div class="countdown-bar" id="countdown-bar">
    <div class="countdown-label">放送まで</div>
    <div class="countdown-num" id="countdown-num">--:--:--</div>
  </div>

  <div class="next-section">
    <div class="next-header">今後の放送予定</div>
    <div id="next-list"></div>
  </div>

  <div class="btn-area">
    <button class="btn-stop" id="btn-stop" onclick="stopAlarm()">アラームを止める</button>
    <button class="btn-test" id="btn-test" onclick="testAlarm()">テスト再生</button>
  </div>

<script>
const LINEUP = [
  { date: "2026-05-25", title: "ユニバーサル・ソルジャー", meta: "1992◆アメリカ｜監督 ローランド・エメリッヒ", theme: "" },
  { date: "2026-05-26", title: "スリーデイズ", meta: "2010◆アメリカ｜監督 ポール・ハギス", theme: "" },
  { date: "2026-05-27", title: "アザーズ", meta: "2001◆アメリカ｜監督 アレハンドロ・アメナーバル", theme: "水曜は危機に立ち向かう美女たち！" },
  { date: "2026-05-28", title: "山猫は眠らない４ 復活の銃弾", meta: "2011◆アメリカ｜監督 クラウディオ・ファエ", theme: "木曜は山猫シリーズ一挙放送！" },
  { date: "2026-05-29", title: "００７は二度死ぬ", meta: "1967◆イギリス｜監督 ルイス・ギルバート", theme: "金曜は００７シリーズ一挙放送！" },
  { date: "2026-06-01", title: "96時間", meta: "2008◆フランス／アメリカ｜監督 ピエール・モレル", theme: "雨季雨季！スペシャルウイーク！" },
  { date: "2026-06-02", title: "デジャヴ", meta: "2006◆アメリカ｜監督 トニー・スコット", theme: "雨季雨季！スペシャルウイーク！" },
  { date: "2026-06-03", title: "シャドー・チェイサー", meta: "2012◆アメリカ｜監督 マブルク・エル・メクリ", theme: "雨季雨季！スペシャルウイーク！水曜は美女特集！" },
  { date: "2026-06-04", title: "山猫は眠らない５ 反逆の銃痕", meta: "2014◆アメリカ｜監督 ドン・マイケル・ポール", theme: "雨季雨季！スペシャルウイーク！" },
  { date: "2026-06-05", title: "女王陛下の００７", meta: "1969◆イギリス｜監督 ピーター・ハント", theme: "雨季雨季！スペシャルウイーク！金曜は００７シリーズ！" },
  { date: "2026-06-08", title: "クロッシング・ガード", meta: "1995◆アメリカ｜監督 ショーン・ペン", theme: "" },
  { date: "2026-06-09", title: "バニシング・レッド", meta: "1992◆アメリカ｜監督 ビク・アームストロング", theme: "" },
  { date: "2026-06-10", title: "ザ・ロストシティ", meta: "2022◆アメリカ｜監督 アダム・ニー", theme: "水曜は美女特集！" },
  { date: "2026-06-11", title: "山猫は眠らない６ 裏切りの銃撃", meta: "2016◆アメリカ｜監督 ドン・マイケル・ポール", theme: "木曜は山猫シリーズ！" },
  { date: "2026-06-12", title: "００７／ダイヤモンドは永遠に", meta: "1971◆イギリス｜監督 ガイ・ハミルトン", theme: "金曜は００７シリーズ！" },
];

const DAYS = ['日','月','火','水','木','金','土'];
let actx = null, alarmTimer = null, lastAlarmDate = null;

function getCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
function beep(freq, t0, dur) {
  const c = getCtx();
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.frequency.value = freq; o.type = 'sine';
  g.gain.setValueAtTime(0.3, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t0 + dur);
  o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
}
function playSound() {
  [523, 659, 784, 659, 523, 784].forEach((f, i) => beep(f, i * 0.15, 0.13));
}

function startAlarm() {
  document.getElementById('clock').classList.add('ringing');
  document.getElementById('ringing-banner').style.display = 'block';
  document.getElementById('live-dot').classList.remove('inactive');
  document.getElementById('card-label').textContent = '現在放送中！';
  document.getElementById('btn-stop').style.display = 'block';
  document.getElementById('btn-test').style.display = 'none';
  document.getElementById('countdown-bar').style.display = 'none';
  alarmTimer = setInterval(playSound, 1400);
  playSound();
}

function stopAlarm() {
  clearInterval(alarmTimer); alarmTimer = null;
  document.getElementById('clock').classList.remove('ringing');
  document.getElementById('ringing-banner').style.display = 'none';
  document.getElementById('card-label').textContent = '本日の放送';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-test').style.display = 'block';
  document.getElementById('countdown-bar').style.display = 'block';
}

function testAlarm() { startAlarm(); setTimeout(stopAlarm, 5000); }

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function findMovie(dateStr) {
  return LINEUP.find(m => m.date === dateStr) || null;
}

function buildNextList(todayStr) {
  const upcoming = LINEUP.filter(m => m.date > todayStr).slice(0, 5);
  const el = document.getElementById('next-list');
  el.innerHTML = '';
  upcoming.forEach(m => {
    const d = new Date(m.date + 'T00:00:00');
    const row = document.createElement('div');
    row.className = 'next-item';
    row.innerHTML = `
      <span class="next-date">${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()]}）</span>
      <span class="next-title">${m.title}</span>`;
    el.appendChild(row);
  });
  if (upcoming.length === 0) {
    el.innerHTML = '<div class="next-item"><span class="next-title" style="color:var(--muted)">データなし</span></div>';
  }
}

function tick() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const todayStr = toDateStr(now);
  const wday = now.getDay();
  document.getElementById('date-str').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${DAYS[wday]}）`;

  const movie = findMovie(todayStr);
  const isWeekday = wday >= 1 && wday <= 5;

  if (movie && isWeekday) {
    document.getElementById('movie-title').textContent = movie.title;
    document.getElementById('movie-meta').textContent = movie.meta;
    document.getElementById('movie-theme').textContent = movie.theme;
    document.getElementById('live-dot').classList.remove('inactive');
  } else {
    document.getElementById('movie-title').textContent = isWeekday ? '放送情報なし' : '本日は放送なし（土日）';
    document.getElementById('movie-meta').textContent = isWeekday ? '公式サイトをご確認ください' : '月〜金 13:40 放送';
    document.getElementById('movie-theme').textContent = '';
    document.getElementById('live-dot').classList.add('inactive');
  }

  buildNextList(todayStr);

  const alarm = new Date(now);
  alarm.setHours(13, 40, 0, 0);
  if (!alarmTimer) {
    if (isWeekday && now.getHours() === 13 && now.getMinutes() === 40 && lastAlarmDate !== todayStr) {
      lastAlarmDate = todayStr;
      startAlarm();
    }
    const next = new Date(alarm);
    if (next <= now) next.setDate(next.getDate() + 1);
    while (next.getDay() === 0 || next.getDay() === 6) next.setDate(next.getDate() + 1);
    const diff = next - now;
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('countdown-num').textContent =
      `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

setInterval(tick, 1000);
tick();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
