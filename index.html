<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="13:40アラーム">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>13:40 アラーム</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: rgba(240,240,240,0.4);
      --accent: #c8f060;
      --warn: #ff8c42;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3rem 1.5rem 2.5rem;
      overflow: hidden;
    }

    /* 背景の装飾リング */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      border: 1px solid rgba(200, 240, 96, 0.04);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(200, 240, 96, 0.06);
      pointer-events: none;
    }

    /* ヘッダー */
    .header {
      text-align: center;
      width: 100%;
    }
    .header-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* メイン時計 */
    .clock-wrap {
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .clock {
      font-family: 'DM Mono', monospace;
      font-size: clamp(52px, 18vw, 80px);
      font-weight: 300;
      letter-spacing: -2px;
      color: var(--text);
      line-height: 1;
      transition: color 0.3s;
    }
    .clock.ringing {
      color: var(--warn);
      animation: flicker 0.4s infinite alternate;
    }
    @keyframes flicker {
      from { opacity: 1; }
      to { opacity: 0.7; }
    }

    .date {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* アラームカード */
    .alarm-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }
    .alarm-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(200,240,96,0.03) 0%, transparent 60%);
      pointer-events: none;
    }

    .alarm-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .alarm-dot.ringing {
      background: var(--warn);
      animation: pulse-dot 0.6s infinite alternate;
    }
    @keyframes pulse-dot {
      from { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,140,66,0.4); }
      to { transform: scale(1.3); box-shadow: 0 0 0 8px rgba(255,140,66,0); }
    }

    .alarm-info { flex: 1; }
    .alarm-time-text {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 400;
      color: var(--text);
    }
    .alarm-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.05em;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid rgba(200,240,96,0.3);
      color: var(--accent);
      background: rgba(200,240,96,0.06);
      white-space: nowrap;
      transition: all 0.3s;
    }
    .status-badge.ringing {
      border-color: rgba(255,140,66,0.4);
      color: var(--warn);
      background: rgba(255,140,66,0.08);
    }

    /* 次のアラーム */
    .next-label {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.03em;
      min-height: 18px;
    }

    /* ボタン群 */
    .btn-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-stop {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: none;
      background: var(--warn);
      color: #0a0a0a;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.05em;
      display: none;
      animation: pulse-btn 0.8s infinite alternate;
    }
    @keyframes pulse-btn {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    .btn-test {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-test:active {
      background: var(--surface);
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-label">毎日のアラーム</div>
  </div>

  <div class="clock-wrap">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>
  </div>

  <div style="width:100%; display:flex; flex-direction:column; gap:16px;">
    <div class="alarm-card" id="alarm-card">
      <div class="alarm-dot" id="alarm-dot"></div>
      <div class="alarm-info">
        <div class="alarm-time-text">13:40</div>
        <div class="alarm-sub">月曜 〜 金曜</div>
      </div>
      <div class="status-badge" id="status-badge">待機中</div>
    </div>

    <div class="next-label" id="next-label"></div>

    <div class="btn-area">
      <button class="btn-stop" id="btn-stop" onclick="stopAlarm()">アラームを止める</button>
      <button class="btn-test" id="btn-test" onclick="testAlarm()">テスト再生</button>
    </div>
  </div>

  <script>
    const DAYS = ['日','月','火','水','木','金','土'];
    let actx = null, alarmTimer = null, lastDate = null;

    function getCtx() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      return actx;
    }
    function beep(freq, t0, dur) {
      const c = getCtx();
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.35, c.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t0 + dur);
      o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
    }
    function playSound() {
      [880,1046,1174,1046,880].forEach((f,i) => beep(f, i*0.18, 0.15));
    }

    function startAlarm() {
      document.getElementById('clock').classList.add('ringing');
      document.getElementById('alarm-dot').classList.add('ringing');
      const badge = document.getElementById('status-badge');
      badge.textContent = 'アラーム！';
      badge.classList.add('ringing');
      document.getElementById('btn-stop').style.display = 'block';
      document.getElementById('btn-test').style.display = 'none';
      document.getElementById('next-label').textContent = '';
      alarmTimer = setInterval(playSound, 1300);
      playSound();
    }

    function stopAlarm() {
      clearInterval(alarmTimer); alarmTimer = null;
      document.getElementById('clock').classList.remove('ringing');
      document.getElementById('alarm-dot').classList.remove('ringing');
      const badge = document.getElementById('status-badge');
      badge.textContent = '待機中';
      badge.classList.remove('ringing');
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('btn-test').style.display = 'block';
    }

    function testAlarm() { startAlarm(); setTimeout(stopAlarm, 5000); }

    function nextAlarmStr() {
      const now = new Date();
      const d = new Date(now);
      d.setHours(13, 40, 0, 0);
      if (d <= now) d.setDate(d.getDate() + 1);
      while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
      const diff = d - now;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return `次は${DAYS[d.getDay()]}曜日まであと ${h}時間 ${m}分`;
    }

    function tick() {
      const now = new Date();
      const pad = n => String(n).padStart(2,'0');
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('date').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${DAYS[now.getDay()]}）`;
      const wd = now.getDay(), ts = now.toDateString();
      if (wd >= 1 && wd <= 5 && now.getHours() === 13 && now.getMinutes() === 40 && !alarmTimer && lastDate !== ts) {
        lastDate = ts; startAlarm();
      }
      if (!alarmTimer) document.getElementById('next-label').textContent = nextAlarmStr();
    }

    setInterval(tick, 1000); tick();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
